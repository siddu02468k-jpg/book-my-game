<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bmg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="bmg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#22c55e" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Pitch Squircle Background -->
  <rect width="64" height="64" rx="18" fill="#0a0f0d" stroke="#1e2923" stroke-width="2" />

  <!-- Admission Ticket Body with Notches -->
  <g transform="translate(7, 13)" filter="url(#bmg-glow)">
    <path
      d="M 5 0 
         L 45 0 
         A 5 5 0 0 1 50 5 
         L 50 13 
         A 5 5 0 0 0 50 23 
         L 50 33 
         A 5 5 0 0 1 45 38 
         L 5 38 
         A 5 5 0 0 1 0 33 
         L 0 23 
         A 5 5 0 0 0 0 13 
         L 0 5 
         A 5 5 0 0 1 5 0 Z"
      fill="url(#bmg-grad)"
    />

    <!-- Turf Court Markings -->
    <rect x="8" y="5" width="34" height="28" rx="2" fill="none" stroke="#052e16" stroke-width="1.2" opacity="0.35" />
    <line x1="25" y1="5" x2="25" y2="33" stroke="#052e16" stroke-width="1.2" opacity="0.35" />
    <circle cx="25" cy="19" r="4.5" fill="none" stroke="#052e16" stroke-width="1.2" opacity="0.35" />

    <!-- Text: GAME -->
    <text
      x="25"
      y="22.5"
      text-anchor="middle"
      fill="#052012"
      font-family="system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="11"
      letter-spacing="1.2"
    >
      GAME
    </text>

    <!-- Barcode Stripes at Base -->
    <g stroke="#052012" stroke-width="1.2" opacity="0.9">
      <line x1="11" y1="27" x2="11" y2="33" />
      <line x1="14" y1="27" x2="14" y2="33" />
      <line x1="18" y1="27" x2="18" y2="33" />
      <line x1="21" y1="27" x2="21" y2="33" />
      <line x1="25" y1="27" x2="25" y2="33" />
      <line x1="29" y1="27" x2="29" y2="33" />
      <line x1="33" y1="27" x2="33" y2="33" />
      <line x1="37" y1="27" x2="37" y2="33" />
    </g>
  </g>
</svg>
